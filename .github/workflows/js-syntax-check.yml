name: JavaScript syntax check
on:
  push:
    branches: [main]
    paths:
      - 'js/**.js'
      - 'js/**/*.js'
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          set -e
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
