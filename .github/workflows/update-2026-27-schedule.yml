name: Build bundled 2026-27 NBA Schedule
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/import-2026-27-schedule.mjs']
permissions:
  contents: write
jobs:
  schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/import-2026-27-schedule.mjs
      - name: Commit bundled schedule
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/schedule-2026-27.json
          git diff --cached --quiet || git commit -m "Bundle verified 2026-27 NBA schedule"
          git push
