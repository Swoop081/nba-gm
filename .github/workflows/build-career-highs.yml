name: Build career highs
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build-career-highs.mjs'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify career-high dataset
        run: node scripts/build-career-highs.mjs
      - name: Commit verified dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/career-highs.js data/career-highs-audit.json
          git diff --cached --quiet || git commit -m "Generate verified NBA career highs"
          git push
